# /etc/nginx/sites-available/harbour  (then: ln -s ../sites-available/harbour /etc/nginx/sites-enabled/)
#
# One domain serves everything:
#   https://crm.yourdomain.com/            -> the website (React build in /var/www/harbour-web)
#   https://crm.yourdomain.com/api/...     -> Node.js backend on port 5000
#   https://crm.yourdomain.com/socket.io/  -> realtime (websockets)
#
# With this setup use  VITE_API_URL=https://crm.yourdomain.com  (web)
# and EXPO_PUBLIC_API_URL=https://crm.yourdomain.com  (mobile).
# Run `certbot --nginx -d crm.yourdomain.com` afterwards to add HTTPS.

server {
    listen 80;
    server_name crm.yourdomain.com;

    # documents can be up to 25 MB (MAX_UPLOAD_MB in backend .env)
    client_max_body_size 30m;

    # ---- API ----
    location /api/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # ---- Realtime (Socket.IO websockets) ----
    location /socket.io/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }

    # ---- Website (React build) ----
    root /var/www/harbour-web;
    index index.html;

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # client-side routing: every unknown path loads index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
